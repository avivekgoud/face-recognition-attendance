version: '3.8'

services:
  facesync-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: facesync_attendance
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=${SECRET_KEY:-}
      - BIOMETRIC_ENCRYPTION_KEY=${BIOMETRIC_ENCRYPTION_KEY:-}
    volumes:
      - facesync_data:/app/backend/data

volumes:
  facesync_data:
    driver: local
